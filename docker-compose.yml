services:
  postgres:
    image: postgres:16-alpine
    container_name: softsauda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-softsauda}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-softsauda}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: softsauda-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    ports:
      - "80:3000"

  scraper-cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    container_name: softsauda-scraper-cron
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      # 8 AM, 12 PM, 4 PM, 8 PM IST = 2:30, 6:30, 10:30, 14:30 UTC
      SCRAPER_CRON_SCHEDULE: "30 2,6,10,14 * * *"

volumes:
  postgres_data:
